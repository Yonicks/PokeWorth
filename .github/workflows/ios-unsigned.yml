# Builds PokeWorth for iPhone WITHOUT signing, on a free GitHub macOS machine, and uploads an
# unsigned .ipa. Sign and install it from Windows with a free Apple ID (Sideloadly or AltStore):
# see docs/iphone-sideload.md. Run it from the Actions tab ("Run workflow").
#
# Release configuration: the JavaScript is bundled inside the app, so no dev server is needed.
# The phone's own text reader (Apple Vision) is included, unlike in Expo Go.
name: iOS unsigned build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 58 needs Xcode 26.4 or newer.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ios/ is generated (Continuous Native Generation); it is never committed.
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        run: cd ios && pod install

      - name: Build (no code signing)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60

      - name: Package the .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr PokeWorth-unsigned.ipa Payload
          ls -lh PokeWorth-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PokeWorth-unsigned-ipa
          path: PokeWorth-unsigned.ipa
          retention-days: 7
