<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokeWorth Web Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
/* One visual world: deep navy night with gold accents (design/home-spec.md §2). Single dark theme by design.
   Layout: a phone-sized app column; on wide screens it sits in a device frame, on phones it fills the screen. */
:root {
  color-scheme: dark;
  --bg-top: #001643;
  --bg: #031229;
  --bg-bottom: #0C1C33;
  --surface: #0A1A30;
  --surface-row: #05162B;
  --raised: #12243B;
  --tile: #091C33;
  --border: #1E3150;
  --border-strong: #2A3D5A;
  --gold-300: #FDDF6F;
  --gold-400: #FDCB56;
  --gold-500: #FEBD3D;
  --gold-text: #FEDF4E;
  --price: #FEE144;
  --text: #FEFEFE;
  --text-2: #CDD9EC;
  --text-3: #A9B9D3;
  --on-gold: #0B0B0D;
  --link-blue: #2BB1FE;
  --tab-inactive: #B0C0DA;
  --good: #4ADE80;
  --warn: #FBBF24;
  --bad: #F87171;
  --font-display: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --gutter: 26px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #01070F;
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }

/* ---------- App shell ---------- */
.app {
  position: relative; overflow: hidden;
  width: 100%; height: 100%;
  background:
    radial-gradient(120% 55% at 70% 0%, var(--bg-top) 0%, rgba(0,22,67,0) 70%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg) 60%, var(--bg-bottom) 100%);
}
@media (min-width: 560px) and (min-height: 720px) {
  body { background: radial-gradient(80% 60% at 50% 30%, #0B1A33 0%, #01070F 70%); }
  .app {
    width: 393px; height: min(852px, calc(100% - 40px));
    border-radius: 46px;
    box-shadow: 0 0 0 10px #0E1420, 0 0 0 11px #2A3346, 0 30px 80px rgba(0,0,0,.6);
  }
}
.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  padding-top: max(env(safe-area-inset-top), 14px);
  padding-bottom: calc(110px + env(safe-area-inset-bottom));
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen.enter { animation: enter .22s ease-out; }
@keyframes enter { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen.enter { animation: none; } * { transition: none !important; } }

.decor { position: absolute; pointer-events: none; }

/* ---------- Brand ---------- */
.brand { display: flex; align-items: center; gap: 10px; }
.wordmark { font-family: var(--font-display); font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
.wordmark .w { color: var(--gold-text); }
.wordmark .p { background: linear-gradient(180deg, #FFFFFF 30%, #C9D4E6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--text); }
.icon-btn.ringed { width: 34px; height: 34px; background: #0F2035; box-shadow: inset 0 0 0 1px var(--border); }

/* ---------- Shared pieces ---------- */
.cta {
  position: relative; display: flex; align-items: center; width: 100%;
  border-radius: 14px; color: var(--on-gold);
  background: linear-gradient(180deg, var(--gold-300) 0%, var(--gold-400) 50%, var(--gold-500) 100%);
  box-shadow: 0 0 22px rgba(253,203,86,.45), inset 0 1px 0 rgba(255,241,176,.7);
  overflow: hidden; transition: transform .12s ease, box-shadow .12s ease;
}
.cta:active { transform: scale(.985); }
.cta:hover { box-shadow: 0 0 30px rgba(253,203,86,.6), inset 0 1px 0 rgba(255,241,176,.7); }
.cta .chev { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); }
.panel-btn {
  display: flex; align-items: center; width: 100%;
  background: linear-gradient(180deg, #152A44 0%, var(--raised) 100%);
  box-shadow: inset 0 0 0 1px var(--border-strong);
  border-radius: 12px; transition: background .15s ease;
}
.panel-btn:hover { background: linear-gradient(180deg, #1A3150 0%, #14294A 100%); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 var(--gutter); }
.section-head h2 { margin: 0; font-size: 20px; line-height: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.see-all { display: inline-flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 500; color: var(--link-blue); }
.layout-r2 .see-all { color: var(--gold-text); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
.chip.demo { background: rgba(43,177,254,.14); color: #8FD3FF; box-shadow: inset 0 0 0 1px rgba(43,177,254,.35); }
.chip.gold { background: rgba(254,223,78,.12); color: var(--gold-text); box-shadow: inset 0 0 0 1px rgba(254,223,78,.35); }
.chip.good { background: rgba(74,222,128,.12); color: var(--good); box-shadow: inset 0 0 0 1px rgba(74,222,128,.35); }
.chip.warn { background: rgba(251,191,36,.12); color: var(--warn); box-shadow: inset 0 0 0 1px rgba(251,191,36,.35); }
.chip.bad { background: rgba(248,113,113,.12); color: var(--bad); box-shadow: inset 0 0 0 1px rgba(248,113,113,.35); }
.price { color: var(--price); font-weight: 700; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.footnote { padding: 18px var(--gutter) 0; font-size: 12px; line-height: 17px; color: var(--text-3); }

/* ---------- R1 home ---------- */
.r1-header { display: flex; align-items: center; justify-content: space-between; padding: 18px var(--gutter) 0; position: relative; z-index: 2; }
.r1-hero { position: relative; padding: 0 var(--gutter); }
.r1-hero .art { right: -6px; top: -78px; width: 205px; height: 330px; }
.r1-hero h1 { position: relative; z-index: 1; margin: 34px 0 0; font-size: 28px; line-height: 30px; font-weight: 800; letter-spacing: -0.3px; }
.r1-hero h1 .y { color: var(--gold-text); }
.r1-hero p { position: relative; z-index: 1; margin: 12px 0 0; max-width: 205px; font-size: 14px; line-height: 18px; color: var(--text-2); }
.steps { position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 0; margin-top: 16px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 38px; font-size: 12.5px; color: var(--text); }
.step .tile { width: 27px; height: 27px; border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--gold-text); display: grid; place-items: center; color: var(--gold-text); }
.step-arrow { width: 19px; margin-top: 8px; color: #D0D6E5; display: grid; place-items: center; }
.r1-cta { margin: 22px var(--gutter) 0; width: calc(100% - 2 * var(--gutter)); height: 68px; justify-content: center; gap: 18px; }
.r1-cta .label { font-size: 26px; font-weight: 700; letter-spacing: -0.2px; }
.r1-search { margin: 13px var(--gutter) 0; width: calc(100% - 2 * var(--gutter)); height: 55px; justify-content: center; gap: 18px; position: relative; font-size: 17px; font-weight: 500; }
.r1-search .chev { position: absolute; right: 22px; }
.r1-recent { margin-top: 18px; }
.carousel { display: flex; gap: 8px; overflow-x: auto; padding: 10px var(--gutter) 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.scan-card {
  flex: 0 0 86px; scroll-snap-align: start; text-align: left;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--border);
  border-radius: 8px; padding: 7px 7px 9px; display: flex; flex-direction: column;
  transition: transform .12s ease;
}
.scan-card:hover { transform: translateY(-2px); }
.scan-card .thumb { width: 72px; border-radius: 4px; overflow: hidden; }
.scan-card .name { margin-top: 8px; font-size: 13px; line-height: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scan-card .meta { font-size: 11.5px; line-height: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scan-card .price { margin-top: 5px; font-size: 15px; line-height: 18px; }
.scan-card .time { font-size: 11.5px; line-height: 14px; color: var(--text-3); }
.promo {
  position: relative; overflow: hidden; display: flex; align-items: center; gap: 16px;
  margin: 18px var(--gutter) 0; width: calc(100% - 2 * var(--gutter)); min-height: 66px; padding: 8px 40px 8px 12px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); border-radius: 12px; text-align: left;
}
.promo .collage { right: -8px; top: -6px; width: 170px; height: 90px; opacity: .38; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 60%); mask-image: linear-gradient(90deg, transparent 0%, #000 60%); }
.promo .t { position: relative; font-size: 16px; line-height: 20px; font-weight: 700; }
.promo .s { position: relative; font-size: 12.5px; line-height: 16px; color: var(--text-3); margin-top: 2px; }
.promo .chev { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); }

/* ---------- R2 home ---------- */
.layout-r2 { --gutter: 18px; }
.r2-top { position: relative; padding: 0 var(--gutter); }
.r2-ring { left: 50%; top: -60px; width: 150px; height: 150px; transform: translateX(-50%); opacity: .55; }
.r2-gear { position: absolute; right: var(--gutter); top: 24px; z-index: 3; }
.r2-brand { position: relative; z-index: 2; padding-top: 52px; }
.r2-hero-art { right: -30px; top: 118px; width: 180px; height: 146px; z-index: 0; }
.r2-hero h1 { position: relative; z-index: 1; margin: 14px 0 0; font-size: 20px; line-height: 24px; font-weight: 600; max-width: 215px; }
.r2-hero p { position: relative; z-index: 1; margin: 10px 0 0; font-size: 15px; line-height: 18px; color: var(--text-2); max-width: 210px; }
.r2-cta { margin: 20px var(--gutter) 0; width: calc(100% - 2 * var(--gutter)); height: 85px; border-radius: 18px; padding: 0 44px 0 24px; gap: 22px; z-index: 1; }
.r2-cta .txt { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
.r2-cta .label { font-size: 26px; line-height: 30px; font-weight: 700; }
.r2-cta .sub { font-size: 15px; line-height: 19px; margin-top: 3px; }
.r2-cta .ball { right: 22px; top: -8px; width: 104px; height: 104px; opacity: .14; color: #fff; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px var(--gutter) 0; }
.tile-btn { position: relative; display: flex; align-items: center; gap: 8px; min-height: 63px; padding: 10px 22px 10px 10px; text-align: left; background: var(--tile); box-shadow: inset 0 0 0 1px var(--border); border-radius: 14px; transition: background .15s ease; }
.tile-btn:hover { background: #0E2440; }
.tile-btn .tt { font-size: 14px; line-height: 18px; font-weight: 600; white-space: nowrap; }
.tile-btn .ts { font-size: 11.5px; line-height: 15px; color: var(--text-2); margin-top: 2px; }
.tile-btn .chev { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
.r2-recent { margin-top: 26px; }
.rows { display: flex; flex-direction: column; gap: 10px; padding: 12px var(--gutter) 0; }
.row {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 75px;
  padding: 9px 38px 9px 9px; text-align: left;
  background: var(--surface-row); box-shadow: inset 0 0 0 1px var(--border); border-radius: 12px;
  transition: background .15s ease;
}
button.row:hover { background: #0A1E38; }
.row .thumb { flex: 0 0 46px; border-radius: 4px; overflow: hidden; }
.row .info { flex: 1; min-width: 0; }
.row .name { font-size: 16px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .set { font-size: 14px; line-height: 18px; color: #DBE7F9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 12.5px; line-height: 16px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.row .right .price { font-size: 18px; line-height: 22px; }
.row .right .time { font-size: 13px; color: var(--text-2); }
.row > .chev { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-2); }

/* ---------- Tab bars ---------- */
.tabbar-r1 {
  position: absolute; left: 8px; right: 8px; bottom: calc(10px + env(safe-area-inset-bottom)); height: 60px; z-index: 20;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: rgba(13,29,52,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: inset 0 0 0 1px var(--border), 0 10px 30px rgba(0,0,0,.45); border-radius: 18px;
}
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; color: var(--tab-inactive); position: relative; }
.tab.active { color: var(--gold-text); font-weight: 600; }
.tabbar-r2 {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  height: calc(84px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr;
}
.tabbar-r2 .bar-bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.tabbar-r2 .tab.active::after { content: ""; position: absolute; bottom: 12px; width: 37px; height: 2.5px; border-radius: 2px; background: var(--gold-500); }
.fab {
  position: relative; top: -26px; justify-self: center; width: 62px; height: 62px; border-radius: 50%;
  display: grid; place-items: center; color: var(--on-gold);
  background: radial-gradient(circle at 50% 35%, var(--gold-300), var(--gold-500));
  box-shadow: 0 0 0 6px rgba(253,203,86,.14), 0 0 26px rgba(253,203,86,.55);
}

/* ---------- Sub-screens ---------- */
.topbar { display: flex; align-items: center; gap: 6px; padding: 12px 12px 6px; position: sticky; top: 0; z-index: 5; }
.topbar h1 { margin: 0; font-size: 20px; line-height: 24px; font-weight: 700; flex: 1; }
.page { padding: 8px var(--gutter) 0; display: flex; flex-direction: column; gap: 16px; }
.layout-r1 .page, .layout-r1 .rows { --gutter: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 12px; font-weight: 600; font-size: 15px; }
.btn.gold { color: var(--on-gold); background: linear-gradient(180deg, var(--gold-300), var(--gold-500)); box-shadow: 0 0 18px rgba(253,203,86,.35); }
.btn.ghost { background: var(--raised); box-shadow: inset 0 0 0 1px var(--border-strong); }
.btn.danger { color: var(--bad); background: rgba(248,113,113,.08); box-shadow: inset 0 0 0 1px rgba(248,113,113,.35); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: default; }
.card-panel { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); border-radius: 14px; padding: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--text-3); }
.input { height: 46px; border-radius: 12px; padding: 0 14px; background: #0B1B31; color: var(--text); border: 0; box-shadow: inset 0 0 0 1px var(--border-strong); font-size: 16px; width: 100%; }
.input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--gold-text); }
.search-box { position: relative; }
.search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.search-box .input { padding-left: 44px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); }
.chips::-webkit-scrollbar { display: none; }
.filter { flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; background: var(--raised); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--border); white-space: nowrap; }
.filter.on { background: rgba(254,223,78,.14); color: var(--gold-text); box-shadow: inset 0 0 0 1px rgba(254,223,78,.5); }
.empty { text-align: center; padding: 26px 8px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--text-2); }
.empty h2 { margin: 0; font-size: 18px; color: var(--text); }
.empty p { margin: 0; font-size: 14px; line-height: 20px; max-width: 280px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--tile); box-shadow: inset 0 0 0 1px var(--border); border-radius: 12px; padding: 10px 12px; }
.stat .v { font-size: 20px; line-height: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; background: #0B1B31; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--border-strong); }
.stepper button { width: 32px; height: 32px; display: grid; place-items: center; color: var(--text); }
.stepper span { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #0B1B31; padding: 4px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--border); }
.seg button { padding: 9px 8px; border-radius: 9px; font-size: 13px; line-height: 17px; color: var(--text-2); text-align: center; }
.seg button.on { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--gold-text); }
.pref-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); font-size: 15px; }
.pref-row:first-child { border-top: 0; }
.pref-row .d { font-size: 12.5px; color: var(--text-3); margin-top: 2px; line-height: 17px; }
.switch { width: 46px; height: 28px; border-radius: 999px; background: #22324B; position: relative; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s ease; }
.switch[aria-checked="true"] { background: var(--gold-500); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }

/* Scan */
.viewport { position: relative; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: radial-gradient(80% 60% at 50% 45%, #13233C, #050C18); box-shadow: inset 0 0 0 1px var(--border); display: grid; place-items: center; }
.viewport img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.frame { position: absolute; width: 62%; aspect-ratio: 63 / 88; }
.frame i { position: absolute; width: 26px; height: 26px; border: 3px solid var(--gold-text); }
.frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
.frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
.frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }
.frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
.viewport .hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--text-2); text-shadow: 0 1px 6px #000; }
.scanline { position: absolute; left: 19%; right: 19%; height: 2px; background: linear-gradient(90deg, transparent, var(--gold-text), transparent); box-shadow: 0 0 12px var(--gold-text); animation: sweep 1.6s ease-in-out infinite alternate; }
@keyframes sweep { from { top: 22%; } to { top: 78%; } }
@media (prefers-reduced-motion: reduce) { .scanline { animation: none; top: 50%; } }
.status-line { display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 19px; color: var(--text-2); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(254,223,78,.25); border-top-color: var(--gold-text); animation: spin .8s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.score { height: 5px; border-radius: 3px; background: #1A2B45; overflow: hidden; margin-top: 6px; width: 100%; }
.score i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--gold-500), var(--gold-300)); }
.row.best { box-shadow: inset 0 0 0 1.5px var(--gold-text); }

/* Result */
.result-hero { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 4px; }
.result-hero .big { width: 200px; border-radius: 10px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.5), 0 0 40px rgba(253,203,86,.18); }
.result-title { text-align: center; }
.result-title h2 { margin: 0; font-size: 24px; line-height: 28px; font-weight: 800; }
.result-title .s { color: var(--text-2); font-size: 14px; margin-top: 4px; }
.price-big { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.price-big .amt { font-size: 34px; line-height: 38px; }

/* ===================== Text matching (ported from src/utils/text.ts + card-matcher.service.ts) ===================== */
function normalize(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  const curr = new Array(b.length + 1);
  for (let i = 1; i <= a.length; i++) {
    curr[0] = i;
    for (let j = 1; j <= b.length; j++) {
      curr[j] = Math.min(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = curr.slice();
  }
  return prev[b.length];
}
function similarity(a, b) {
  const na = normalize(a), nb = normalize(b);
  if (!na || !nb) return 0;
  return 1 - levenshtein(na, nb) / Math.max(na.length, nb.length);
}
const normId = id => normalize(id).replace(/^0+(?=\d)/, '').replace(/\s/g, '');

/** Rank the offline catalog against what was read off the card. */
function matchCard(parsed) {
  if (!parsed.name && !parsed.number) return { candidates: [], confidentId: null };
  const ranked = CATALOG.map(card => {
    const reasons = [];
    let score = 0;
    if (parsed.name) {
      const ns = similarity(parsed.name, card.name);
      score += ns * 0.6;
      reasons.push(`name ${Math.round(ns * 100)}%`);
    }
    if (parsed.number) {
      if (normId(card.number) === normId(parsed.number)) { score += 0.4; reasons.push('number exact'); }
    } else {
      score = parsed.name ? score / 0.6 : 0;
    }
    if (parsed.total && card.total === Number(parsed.total)) { score += 0.2; reasons.push('set size match'); }
    return { card, score: Math.min(score, 1), reasons };
  }).filter(c => c.score >= 0.35).sort((a, b) => b.score - a.score).slice(0, 8);
  const [best, second] = ranked;
  const confident = !!best && best.score >= 0.85 && (!second || best.score - second.score >= 0.15);
  return { candidates: ranked, confidentId: confident ? best.card.id : null };
}

/* ===================== Claude card reading (optional runtime capability) ===================== */
const claudeCap = { sample: null, images: false };
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('sample').then(async s => {
    if (!s) return;
    claudeCap.sample = s;
    try { claudeCap.images = !!(await s.limits()).images; } catch { claudeCap.images = false; }
    if (['scan', 'prefs'].includes(route().name)) render();
  }).catch(() => {});
}
async function readCardWithClaude(blob) {
  const prompt = `You are reading a photo of a single English Pokémon trading card.
Return ONLY a JSON object, no prose, with these keys:
{"name": string|null, "number": string|null, "total": number|null, "lines": string[]}
- name: the card name printed at the top (e.g. "Charizard ex"), without HP or stage text.
- number: the collector number before the slash at the bottom (e.g. "4" from "4/102", "TG12" from "TG12/TG30").
- total: the number after the slash, as a number.
- lines: up to 6 short text lines you can read, for debugging.
If the photo is not a Pokémon card or text is unreadable, use null values.`;
  const res = await claudeCap.sample(prompt, { images: [blob] });
  const m = String(res.text || '').match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No card text came back.');
  const j = JSON.parse(m[0]);
  return { name: j.name || '', number: j.number ? String(j.number) : '', total: j.total ? Number(j.total) : '', lines: Array.isArray(j.lines) ? j.lines.slice(0, 6) : [] };
}

/* ===================== Scan session (in memory) ===================== */
const scan = { url: null, blob: null, source: null, sampleId: null, busy: false, error: '', parsed: null, method: '' };
function resetScan() {
  if (scan.url && scan.url.startsWith('blob:')) URL.revokeObjectURL(scan.url);
  Object.assign(scan, { url: null, blob: null, source: null, sampleId: null, busy: false, error: '', parsed: null, method: '' });
}
async function downscale(file, max = 1280) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * r); cv.height = Math.round(img.naturalHeight * r);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', .88));
  } finally { URL.revokeObjectURL(url); }
}
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image')); i.src = src; });
}
/** Render a catalog card onto a "table" photo so the scan flow can be tried without a real card. */
async function makeSamplePhoto(card) {
  const svg = cardFaceSVG(card).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" height="528" ').replace('width="100%"', 'width="378"');
  const img = await loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
  const cv = document.createElement('canvas');
  cv.width = 600; cv.height = 800;
  const g = cv.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 600, 800);
  bg.addColorStop(0, '#5B3B23'); bg.addColorStop(1, '#2E1C10');
  g.fillStyle = bg; g.fillRect(0, 0, 600, 800);
  g.globalAlpha = .12; g.strokeStyle = '#000';
  for (let y = 10; y < 800; y += 22) { g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(200, y + 8, 400, y - 8, 600, y + 4); g.stroke(); }
  g.globalAlpha = 1;
  g.save(); g.translate(300, 400); g.rotate(-0.04);
  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 30; g.shadowOffsetY = 14;
  g.drawImage(img, -189, -264, 378, 528);
  g.restore();
  const blob = await new Promise(res => { try { cv.toBlob(b => res(b), 'image/jpeg', .9); } catch { res(null); } });
  return { blob, url: blob ? URL.createObjectURL(blob) : cv.toDataURL('image/jpeg', .9) };
}
async function identify() {
  scan.busy = true; scan.error = ''; render();
  try {
    if (claudeCap.sample && claudeCap.images && scan.blob) {
      scan.parsed = await readCardWithClaude(scan.blob);
      scan.method = 'Read by Claude from your photo';
    } else if (scan.source === 'sample') {
      const c = BY_ID[scan.sampleId];
      scan.parsed = { name: c.name, number: c.number, total: c.total, lines: [] };
      scan.method = 'Text taken from the sample card';
    } else {
      scan.parsed = { name: '', number: '', total: '', lines: [] };
      scan.method = 'Type what is printed on the card';
    }
    scan.busy = false;
    go('confirm');
  } catch (e) {
    scan.busy = false;
    scan.error = e && e.code === 'not_granted'
      ? 'Card reading was not allowed. Type the name and number instead.'
      : e && e.code === 'rate_limited' ? 'Too many reads right now. Wait a moment or type the details.' : 'The card could not be read. Type the name and number instead.';
    scan.parsed = { name: '', number: '', total: '', lines: [] };
    scan.method = 'Type what is printed on the card';
    render();
  }
}

  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('card-') && BY_ID[h.slice(5)]) return { name: 'card', id: h.slice(5) };
  const known = ['home', 'search', 'collection', 'stats', 'recent', 'scan', 'confirm', 'prefs'];
  return { name: known.includes(h) ? h : 'home' };
}

    <div class="chips" role="group" aria-label="Filter by set">${['All', ...SETS].map(s => `<button class="filter${s === searchSet ? ' on' : ''}" data-action="set" data-set="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <div id="search-results">${searchResults()}</div>
  </div>`;
}
function searchResults() {
  const q = searchQuery.trim();
  let list = CATALOG.filter(c => searchSet === 'All' || c.set === searchSet);
  if (q) {
    const num = q.match(/([A-Za-z]{0,4}\d{1,3})\s*(?:\/\s*(\d{1,3}))?$/);
    const nq = normalize(q.replace(/\d+\s*\/\s*\d+$/, ''));
    list = list.map(c => {
      let s = nq ? Math.max(similarity(nq, c.name), normalize(c.name).includes(nq) ? .9 : 0, normalize(c.set).includes(nq) ? .7 : 0) : 0;
      if (num && normId(num[1]) === normId(c.number) && (!num[2] || +num[2] === c.total)) s = Math.max(s, nq ? s + .3 : .95);
      return { c, s };
    }).filter(x => x.s >= .55).sort((a, b) => b.s - a.s).map(x => x.c);
  }
  const head = `<div class="muted" style="font-size:12.5px;margin-bottom:10px">${q ? `${list.length} result${list.length === 1 ? '' : 's'}` : `Browse ${list.length} cards`} · offline demo catalog</div>`;
  if (!list.length) return head + `<div class="empty"><h2>No cards found</h2><p>Try another spelling, or a collector number like 4/102.</p></div>`;
  return head + `<div class="rows" style="padding:0">${list.map(c => cardRow(c, priceRight(c), { go: 'open-' + c.id })).join('')}</div>`;
}

function collectionScreen() {
  const entries = Object.entries(state.collection).filter(([id, q]) => BY_ID[id] && q > 0).map(([id, q]) => ({ card: BY_ID[id], qty: q }))
    .sort((a, b) => b.qty * marketPrice(b.card) - a.qty * marketPrice(a.card));
  const total = entries.reduce((s, e) => s + e.qty * marketPrice(e.card), 0);
  const count = entries.reduce((s, e) => s + e.qty, 0);
  return `${topbar('My Collection', 'home', state.layout === 'r1' && entries.length ? `<button class="icon-btn" data-go="stats" aria-label="Stats">${icon('stats', 22, 1.8)}</button>` : '')}
  <div class="page">
    ${entries.length ? `
      <div class="stat-grid">
        <div class="stat"><div class="v price">${money(total)}</div><div class="l">Total value</div></div>
        <div class="stat"><div class="v">${count}</div><div class="l">Cards</div></div>
        <div class="stat"><div class="v">${entries.length}</div><div class="l">Unique prints</div></div>
      </div>
      <div class="rows" style="padding:0">${entries.map(e => cardRow(e.card,
        `<div class="right"><span class="price">${money(e.qty * marketPrice(e.card))}</span>${stepper(e.card.id, e.qty)}</div>`,
        { tag: 'div' })).join('')}</div>
      <p class="muted" style="font-size:12px;margin:0">Totals use demo prices. Saved in this browser only.</p>`
    : `<div class="empty">
        ${stackedCardsArt()}
        <h2>Start your collection</h2>
        <p>Scan or search a card, then tap Add on its price screen. Your total value updates as you go.</p>
        <button class="btn gold" data-go="scan">${icon('camera', 18, 2.2)} Scan a card</button>
        <button class="btn ghost" data-go="search">${icon('search', 18, 2.2)} Search cards</button>
        ${state.demo ? `<button class="btn ghost" data-action="example-collection">Add example cards</button>` : ''}
      </div>`}
  </div>`;
}

function statsScreen() {
  const entries = Object.entries(state.collection).filter(([id, q]) => BY_ID[id] && q > 0).map(([id, q]) => ({ card: BY_ID[id], qty: q }));
  if (!entries.length) {
    return `${topbar('Stats')}<div class="page"><div class="empty"><h2>No stats yet</h2><p>Stats summarize your collection: total value, value per set and your most valuable cards.</p><button class="btn gold" data-go="collection">Go to collection</button></div></div>`;
  }
  const total = entries.reduce((s, e) => s + e.qty * marketPrice(e.card), 0);
  const bySet = {};
  entries.forEach(e => { bySet[e.card.set] = (bySet[e.card.set] || 0) + e.qty * marketPrice(e.card); });
  const sets = Object.entries(bySet).sort((a, b) => b[1] - a[1]);
  const max = sets[0][1];
  const top = [...entries].sort((a, b) => marketPrice(b.card) - marketPrice(a.card)).slice(0, 5);
  return `${topbar('Stats', state.layout === 'r1' ? 'collection' : 'home')}
  <div class="page">
    <div class="card-panel"><div class="muted" style="font-size:12.5px">Collection value</div><div class="price" style="font-size:34px;line-height:40px">${money(total)}</div><div class="muted" style="font-size:12.5px">${entries.reduce((s, e) => s + e.qty, 0)} cards across ${sets.length} set${sets.length === 1 ? '' : 's'} · demo prices</div></div>
    <div class="card-panel"><strong style="font-size:15px">Value by set</strong>
      <div class="bars" style="margin-top:12px">${sets.map(([s, v]) => `<div class="bar-row"><span class="lbl">${esc(s)}</span><span class="bar-track"><i style="width:${Math.max(3, v / max * 100)}%"></i></span><span class="val">${money(v)}</span></div>`).join('')}</div>
    </div>
    <strong>Most valuable cards</strong>
    <div class="rows" style="padding:0">${top.map(e => cardRow(e.card, priceRight(e.card))).join('')}</div>
  </div>`;
}

function recentScreen() {
  const rec = recentItems();
  return `${topbar('Recent Scans', 'home', rec.demo ? '<span class="chip demo" style="margin-right:8px">Demo</span>' : '')}
  <div class="page">
    ${rec.items.length ? `<div class="rows" style="padding:0">${rec.items.map(i => cardRow(i.card, priceRight(i.card, i.at))).join('')}</div>` : emptyRecent()}
    ${state.history.length ? `<button class="btn danger block" data-action="clear-history">${clearArmed === 'history' ? 'Tap again to clear history' : `${icon('trash', 16, 2.2)} Clear history`}</button>` : ''}
  </div>`;
}

function prefsScreen() {
  const claudeState = !claudeCap.sample ? 'Unavailable in this view: details are typed in by hand.' : claudeCap.images ? 'Available: photos are read by Claude after you allow it.' : 'Available, but image reading is off for this view.';
  return `${topbar('Settings')}
  <div class="page">
    <div class="card-panel">
      <strong style="font-size:15px">Home screen layout</strong>
      <div class="muted" style="font-size:12.5px;margin:4px 0 10px">Two design references exist. Pick one to compare.</div>
      <div class="seg" role="radiogroup" aria-label="Home layout">
        <button role="radio" aria-checked="${state.layout === 'r1'}" class="${state.layout === 'r1' ? 'on' : ''}" data-action="layout" data-layout="r1">Reference 1<br><span class="muted" style="font-size:11.5px">Hero, card row, 3 tabs</span></button>
        <button role="radio" aria-checked="${state.layout === 'r2'}" class="${state.layout === 'r2' ? 'on' : ''}" data-action="layout" data-layout="r2">Reference 2<br><span class="muted" style="font-size:11.5px">List rows, scan button tab</span></button>
      </div>
    </div>
    <div class="card-panel" style="padding-top:4px;padding-bottom:4px">
      <div class="pref-row"><div>Show demo examples<div class="d">Example recent scans when your history is empty.</div></div><button class="switch" role="switch" aria-checked="${state.demo}" aria-label="Show demo examples" data-action="toggle-demo"></button></div>
      <div class="pref-row"><div>Card reading<div class="d">${claudeState}</div></div></div>
      <div class="pref-row"><div>Clear scan history<div class="d">${state.history.length} saved scan${state.history.length === 1 ? '' : 's'}</div></div><button class="btn danger" style="height:36px" data-action="clear-history" ${state.history.length ? '' : 'disabled'}>${clearArmed === 'history' ? 'Confirm' : 'Clear'}</button></div>
      <div class="pref-row"><div>Clear collection<div class="d">${Object.keys(state.collection).length} saved print${Object.keys(state.collection).length === 1 ? '' : 's'}</div></div><button class="btn danger" style="height:36px" data-action="clear-collection" ${Object.keys(state.collection).length ? '' : 'disabled'}>${clearArmed === 'collection' ? 'Confirm' : 'Clear'}</button></div>
    </div>
    <div class="card-panel muted" style="font-size:12.5px;line-height:18px">
      <strong style="color:var(--text);font-size:14px">About this prototype</strong><br>
      A browser build of the PokeWorth plan: scan, identify, confirm, value, search, collection and stats. It uses an offline catalog of ${CATALOG.length} sample cards with illustrative prices and drawn card faces, since this page cannot load live data or remote images. Data stays in this browser. Not affiliated with Nintendo or The Pokémon Company.
    </div>
  </div>`;
}

/* ===================== Tab bars ===================== */
function tabBar(active) {
  const tab = (name, label, ic, icActive) => `<a class="tab${active === name ? ' active' : ''}" href="#${name}" ${active === name ? 'aria-current="page"' : ''}>${icon(active === name && icActive ? icActive : ic, 25, 1.8)}<span>${label}</span></a>`;
  if (state.layout === 'r1') {
    return `<div class="tabbar-r1">${tab('home', 'Home', 'homeOutline', 'home')}${tab('collection', 'Collection', 'cube')}${tab('search', 'Search', 'search')}</div>`;
  }
  return `<div class="tabbar-r2">
    <svg class="bar-bg" viewBox="0 0 393 84" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 22a22 22 0 0 1 22-22H150c12 0 14 4 18 12a32 32 0 0 0 57 0c4-8 6-12 18-12H371a22 22 0 0 1 22 22V84H0z" fill="#041529" stroke="#1E3150" stroke-width="1"/>
    </svg>
    ${tab('home', 'Home', 'homeOutline', 'home')}${tab('collection', 'Collection', 'cube')}
    <a class="fab" href="#scan" aria-label="Scan Card">${icon('camera', 28, 2.2)}</a>
    ${tab('search', 'Search', 'search')}${tab('stats', 'Stats', 'stats')}
  </div>`;
}

/* ===================== Render ===================== */
let lastRoute = '';
function render(animate) {
  const r = route();
  $app.classList.toggle('layout-r1', state.layout === 'r1');
  $app.classList.toggle('layout-r2', state.layout === 'r2');
  let html;
  switch (r.name) {
    case 'scan': html = scanScreen(); break;
    case 'confirm': html = confirmScreen(); break;
    case 'card': html = resultScreen(r.id); break;
    case 'search': html = searchScreen(); break;
    case 'collection': html = collectionScreen(); break;
    case 'stats': html = statsScreen(); break;
    case 'recent': html = recentScreen(); break;
    case 'prefs': html = prefsScreen(); break;
    default: html = state.layout === 'r1' ? homeR1() : homeR2();
  }
  const key = r.name + (r.id || '');
  const changed = key !== lastRoute;
  $screen.innerHTML = html;
  if (changed) {
    $screen.scrollTop = 0;
    if (animate) { $screen.classList.remove('enter'); void $screen.offsetWidth; $screen.classList.add('enter'); }
  }
  lastRoute = key;
  const tabFor = { home: 'home', collection: 'collection', search: 'search', stats: 'stats', recent: 'home', prefs: 'home' }[r.name];
  $tabbar.innerHTML = tabBar(tabFor || '');
  if (r.name !== 'prefs') clearArmed = '';
}

/* ===================== Events ===================== */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function setQty(id, q) {
  if (q <= 0) delete state.collection[id]; else state.collection[id] = q;
  save(); render();
}
const navStack = [];
window.addEventListener('hashchange', () => { navStack.push(location.hash); if (navStack.length > 30) navStack.shift(); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-action],[data-back]');
  if (!el) return;
  if (el.dataset.back) {
    e.preventDefault();
    if (el.dataset.back === 'back' && navStack.length > 1) history.back(); else go(el.dataset.back === 'back' ? 'home' : el.dataset.back);
    return;
  }
  if (el.dataset.go) {
    const g = el.dataset.go;
    if (g.startsWith('pick-')) { const id = g.slice(5); addHistory(id, 'scan'); go('card-' + id); }
    else if (g.startsWith('open-')) { const id = g.slice(5); addHistory(id, 'search'); go('card-' + id); }
    else go(g);
    return;
  }
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'identify': if (!scan.busy) identify(); break;
    case 'sample': {
      const pool = CATALOG.filter(c => c.id !== scan.sampleId);
      const card = pool[Math.floor(Math.random() * pool.length)];
      makeSamplePhoto(card).then(({ blob, url }) => {
        resetScan(); Object.assign(scan, { url, blob, source: 'sample', sampleId: card.id }); render();
      }).catch(() => toast('Could not draw the sample card'));
      break;
    }
    case 'scan-again': resetScan(); go('scan'); break;
    case 'add': setQty(id, 1); toast('Added to your collection'); break;
    case 'inc': setQty(id, (state.collection[id] || 0) + 1); break;
    case 'dec': setQty(id, (state.collection[id] || 0) - 1); break;
    case 'set': searchSet = el.dataset.set; render(); break;
    case 'layout': state.layout = el.dataset.layout; save(); render(); break;
    case 'toggle-demo': state.demo = !state.demo; save(); render(); break;
    case 'example-collection':
      Object.assign(state.collection, { 'ss-223': 1, 'mew-173': 2, 'base1-10': 1, 'evs-189': 1, 'mew-133': 4 });
      save(); render(); toast('Example cards added'); break;
    case 'clear-history':
      if (clearArmed === 'history') { state.history = []; clearArmed = ''; save(); toast('History cleared'); } else clearArmed = 'history';
      render(); break;
    case 'clear-collection':
      if (clearArmed === 'collection') { state.collection = {}; clearArmed = ''; save(); toast('Collection cleared'); } else clearArmed = 'collection';
      render(); break;
  }
});
document.getElementById('photo-input').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const blob = await downscale(file);
    resetScan(); Object.assign(scan, { blob, url: URL.createObjectURL(blob), source: 'photo' });
  } catch {
    resetScan(); scan.error = 'That file could not be opened as an image. Try a JPEG or PNG photo.';
  }
  if (route().name !== 'scan') go('scan'); else render();
});
document.addEventListener('submit', e => {
  if (e.target.id === 'parsed-form') {
    e.preventDefault();
    const f = new FormData(e.target);
    scan.parsed = { ...scan.parsed, name: f.get('name').trim(), number: f.get('number').trim(), total: f.get('total').trim() };
    render();
  } else if (e.target.id === 'search-form') {
    e.preventDefault();
    document.getElementById('search-input').blur();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search-input') {
    searchQuery = e.target.value;
    document.getElementById('search-results').innerHTML = searchResults();
  }
});

navStack.push(location.hash);
render();
</script>
</body>
</html>
